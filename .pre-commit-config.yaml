repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # CI の rust-test と同じ確認(Issue #672)。ファイルは書き換えない。
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt --check
        entry: bash -c 'cd src-tauri && cargo +stable fmt --all --check'
        language: system
        types: [rust]
        pass_filenames: false
