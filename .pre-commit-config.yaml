# pre-push のフックも `pre-commit install` で入るようにする。stages を書かないフックはコミット時だけ。
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # CI の rust-test と同じ確認(Issue #672)。ファイルは書き換えない。
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt --check
        entry: bash -c 'cd src-tauri && cargo +stable fmt --all --check'
        language: system
        types: [rust]
        pass_filenames: false
      # CI の clippy ジョブの Linux 側と同じ確認(Issue #707)。ビルドが要るので push の前だけ。
      # Android 側は NDK の環境変数が要るので CI だけ。macOS / Windows では、CI が見ないその OS 向けのコードの指摘も出る。
      # llama.cpp の再ビルドを含むと重いので、並列度は指定が無ければ 4 にする(Issue #603)。
      - id: clippy
        name: clippy (src-tauri/clippy-toolchain の版)
        entry: bash -c 'cd src-tauri && CARGO_BUILD_JOBS="${CARGO_BUILD_JOBS:-4}" cargo "+$(cat clippy-toolchain)" clippy --all-targets -- -D warnings'
        language: system
        files: ^src-tauri/
        pass_filenames: false
        stages: [pre-push]
