services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.websecure.address=:443
    ports:
      - "8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    depends_on:
      web:
        condition: service_healthy

  web:
    image: misskey/misskey:2026.7.0
    restart: "no"
    environment:
      NODE_ENV: production
    volumes:
      - ./misskey-config/default.yml:/misskey/.config/default.yml:ro
      - misskey_files:/misskey/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "-H", "Content-Type: application/json", "-d", "{}", "http://localhost:3000/api/meta"]
      interval: 5s
      timeout: 5s
      retries: 40
    labels:
      - traefik.enable=true
      - traefik.http.routers.misskey.rule=Host(`misskey.local`)
      - traefik.http.routers.misskey.entrypoints=websecure
      - traefik.http.routers.misskey.tls=true
      - traefik.http.services.misskey.loadbalancer.server.port=3000

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: misskey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  misskey_files:
