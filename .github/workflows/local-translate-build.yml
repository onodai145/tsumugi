name: local-translate-build

# ローカル翻訳（Issue #603）の llama.cpp のビルドが Windows / macOS で通るかを確認する。
# 通常の PR では走らせず、関係するファイルを触ったときと手動のときだけ走る。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/.cargo/**"
      - "src-tauri/src/translate/**"
      - ".github/workflows/local-translate-build.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: ""
          # リリースは macOS を universal（aarch64 + x86_64）でビルドするため、x86_64 も確認する。
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Windows の既定の CARGO_HOME（C:\Users\<名前>\.cargo）だと、llama-cpp-rs の git 依存のサブモジュール
      # （llama.cpp、最長 195 文字のパスを含む）のチェックアウトが MAX_PATH（260）を超えて、`path too long` で失敗する
      # （Issue #603）。後続のステップ（rust-cache を含む）が使えるよう、最初に短いパスへ移す。
      - name: Use a short CARGO_HOME (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"

      # dtolnay/rust-toolchain@stable is an intentionally moving branch that always
      # resolves the current stable Rust release, so it is left unpinned by design.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f4371d1ec7179bfbd04a82a81e3b3af7f720750f # v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() は frontendDist の実在を要求する（test.yml と同じ事情）。
      # cargo check にビルド済みのフロントは要らないので、空の index.html で足りる。
      - name: Create empty frontendDist
        shell: bash
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html>' > frontend/dist/index.html

      - name: cargo check (llama.cpp のビルドを含む)
        working-directory: src-tauri
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -n "$TARGET" ]; then
            cargo check --lib --target "$TARGET"
          else
            cargo check --lib
          fi
