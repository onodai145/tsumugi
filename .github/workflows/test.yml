name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies (Tauri v2 Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # dtolnay/rust-toolchain@stable is an intentionally moving branch that always
      # resolves the current stable Rust release, so it is left unpinned by design.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      # package.json の packageManager は frontend/ 配下にあり action-setup のデフォルト
      # 検出(リポジトリルート)では拾えないため version を明示指定する。
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # cargo test は tauri::generate_context!() をコンパイル時に評価するため、
      # tauri.conf.json の frontendDist(../frontend/dist) が実在している必要がある。
      - name: pnpm build (frontendDist生成)
        working-directory: frontend
        run: pnpm build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # package.json の packageManager は frontend/ 配下にあり action-setup のデフォルト
      # 検出(リポジトリルート)では拾えないため version を明示指定する。
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        working-directory: frontend
        run: pnpm check

      - name: vitest
        working-directory: frontend
        run: pnpm test

  # e2e/scripts/run-app.sh の要件(実機検証済み)に基づく: DNS解決用のLD_PRELOADシムを
  # ビルドするgcc、D-Bus Secret Service用のgnome-keyring-daemon、それを立てる
  # dbus-run-session(dbus-user-session由来)、tauri-driverが叩くWebKitWebDriver、
  # run-app.shが内側に立てる専用Xvfbの起動確認に使うxdpyinfo(x11-utils)が必要。
  # 外側の`xvfb-run -a pnpm e2e`(design docが指定する固定のエントリポイント)用に
  # xvfbも別途要る。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies (Tauri v2 Linux + WebKitWebDriver + Xvfb + D-Bus/keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb \
            x11-utils \
            dbus-x11 \
            dbus-user-session \
            gnome-keyring \
            build-essential

      # dtolnay/rust-toolchain@stable is an intentionally moving branch that always
      # resolves the current stable Rust release, so it is left unpinned by design.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      # @wdio/tauri-service の autoInstallTauriDriver は素の`cargo install
      # tauri-driver`をテスト実行の途中で(ビルド出力を隠したまま)叩くだけなので、
      # 失敗すると原因のわかりにくいwdioのタイムアウトになる。事前に明示ステップで
      # インストールしておけば、ここで失敗した場合に原因が一目でわかる。
      # rust-cacheは~/.cargo/binをキャッシュしないため、android-buildジョブの
      # cargo-tauri CLIキャッシュと同じパターンで別途キャッシュする。
      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: pnpm install (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm build (frontendDist生成)
        working-directory: frontend
        run: pnpm build

      # `cargo tauri build --debug`(--no-bundleなし)はバンドラーのステップで
      # 40分以上ハングすることが確認されている(大きめのdebugバイナリに起因、
      # TLS/DNS周りとは無関係、Task 7 report)。--no-bundleを付ければ回避できる
      # ことも確認済みだが、tauri-cliのbeforeBuildCommand(`pnpm --dir
      # ../frontend build`)はリポジトリルートから実行する前提であり、
      # `working-directory: src-tauri`で(android-buildジョブの
      # `cargo tauri android build`のように)呼ぶと"../frontend"がリポジトリの
      # 外を指して`ERR_PNPM_NO_PKG_MANIFEST`で失敗することを実機検証で確認した
      # (リポジトリルートから呼べば--no-bundleで問題なく成功することも確認済み)。
      # tauri::generate_context!()によるfrontendDistの埋め込みはコンパイル時に
      # tauri.conf.jsonのfrontendDist(../frontend/dist)を読むビルドスクリプト
      # (tauri-build)の仕事であり、tauri-cliのhookとは独立している。そのため
      # 直前のステップで明示的にfrontendを`pnpm build`済みにしたうえで、
      # tauri-cliを経由せずplainな`cargo build`を叩けば、tauri-cliのインストール
      # 自体も省略しつつ同じ埋め込み済みバイナリが得られる(実機検証済み:
      # target/debug/tsumugiが生成され、後続のE2Eテスト3件がpassすることを確認)。
      # run-app.shはtarget/debug/tsumugiを直接実行するだけなのでバンドル
      # 成果物も不要。
      - name: cargo build (debugバイナリ、tauri-cli非経由)
        working-directory: src-tauri
        run: cargo build

      - name: pnpm install (e2e)
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # gen-ca.shが生成する自己署名テストCA(e2e/certs/ca.pem)は、
      # Node側(seed-misskey.ts/miauthBridge.ts)はpackage.jsonのscript内で
      # NODE_EXTRA_CA_CERTSにより既に信頼し、misskey.localの名前解決も
      # 各スクリプト内でnode:dnsのlookup()を127.0.0.1へパッチ済み(実機検証済み)。
      # tsumugi本体(Rust側)もrun-app.shがSSL_CERT_FILE+LD_PRELOADで自己完結して
      # 処理する。したがってOS信頼ストアへのCA登録(install-ca.sh)や
      # /etc/hostsへのmisskey.localエントリ追加は、実uid 1000のsandbox環境と
      # 同様、CI上でも不要(必要ならsudoが使えるubuntu-latestだが、既に
      # 動作確認済みの自己完結パスの方をそのまま踏襲する)。
      - name: Generate test CA
        working-directory: e2e
        run: ./scripts/gen-ca.sh

      - name: Start Misskey stack
        working-directory: e2e
        run: docker compose up -d --wait

      - name: Seed test account
        working-directory: e2e
        run: pnpm seed

      - name: Run E2E tests
        working-directory: e2e
        run: xvfb-run -a pnpm e2e

      - name: Dump Misskey stack logs on failure
        if: failure()
        working-directory: e2e
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-artifacts
          if-no-files-found: ignore
          path: |
            e2e/wdio-logs/
            e2e/docker-compose.log

      - name: Stop Misskey stack
        if: always()
        working-directory: e2e
        run: docker compose down -v

  # Android ターゲットがコンパイル・リンクできるかの検証のみ(署名やアーティファクト配布はしない)。
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          local-cache: true

      # setup-ndk が展開する toolchain 内のシンボリックリンクは相対パスのままで、
      # 展開先ディレクトリが変わるとリンク切れになる(clang ラッパーが exit 127 で失敗する)。
      # tauri-apps/tauri の公式CIワークフローと同じ手当てで絶対パスに直す。
      - name: Restore Android NDK symlinks
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          find "$directory" -type l | while read -r link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
          done

      # dtolnay/rust-toolchain@stable is an intentionally moving branch that always
      # resolves the current stable Rust release, so it is left unpinned by design.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - name: Cache cargo-tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-cli-v2-${{ runner.os }}

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # package.json の packageManager は frontend/ 配下にあり action-setup のデフォルト
      # 検出(リポジトリルート)では拾えないため version を明示指定する。
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: cargo tauri android build (debug, ビルド検証のみ)
        working-directory: src-tauri
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo tauri android build --debug --target aarch64
